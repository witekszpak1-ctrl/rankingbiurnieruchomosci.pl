# Test SEO na stronie produkcyjnej: po wdrożeniu z Vercela (gdy Vercel zgłasza wdrożenia do GitHuba), po każdym
# przebiegu pipeline (co godzinę) i ręcznie.
name: seo-check

on:
  deployment_status:
  workflow_run:
    workflows: [pipeline]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'roduction'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test SEO
        run: node apps/web/scripts/seo-check.mjs https://rankingbiurnieruchomosci.pl
