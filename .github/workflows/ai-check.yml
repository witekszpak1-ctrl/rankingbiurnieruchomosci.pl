# Próbny pomiar odpowiedzi AI w Google przez LiteScrape (zgoda właściciela z 28.11.2026, najwyżej 15 zapytań).
# Uruchamia się ręcznie albo po wypchnięciu gałęzi run/ai-check. Raport trafia do repozytorium kolejki
# (queue/results/reports/ai-check-*.json); klucz LiteScrape jest w panelu i nie jest wypisywany.
name: ai-check

on:
  workflow_dispatch:
  push:
    branches: ["run/ai-check"]

concurrency:
  group: katalog-offers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QUEUE_REPO_TOKEN: ${{ secrets.QUEUE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/worker
      - name: Kolejka
        run: bash scripts/queue_sync.sh pull
      - name: Test odpowiedzi AI (najwyżej 15 zapytań)
        run: katalog ai-check --max 12 --no-search --per-endpoint 4 --endpoint /api/google/gemini --endpoint /api/google/ai-mode --endpoint /api/google/ai-overview
      - name: Raport do kolejki
        if: always()
        run: bash scripts/queue_sync.sh push-results
