# Pomiary odpowiedzi AI do schematu geo (GeoTrace) przez LiteScrape. Płatne zapytania bez limitu budżetu (decyzja
# właściciela z 28.11.2026), z bezpiecznikiem na przebieg. Surowe odpowiedzi trafiają do repozytorium kolejki.
name: geo-measure

on:
  workflow_dispatch:
    inputs:
      cities:
        default: "1"
      prompts:
        default: "2"
      max_calls:
        default: "6"
  push:
    branches: ["run/geo-measure"]
  schedule:
    # Co tydzień w poniedziałek: biblioteka 20 największych miast, 3 pytania, 3 platformy (ok. 180 zapytań).
    # Harmonogramy GitHub bywają zawodne, więc zaplanowana sesja Claude też może uruchomić pomiar (push run/geo-measure).
    - cron: "41 3 * * 1"

concurrency:
  group: katalog-offers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QUEUE_REPO_TOKEN: ${{ secrets.QUEUE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/worker
      - name: Kolejka
        run: bash scripts/queue_sync.sh pull
      - name: Pomiary
        env:
          CITIES: ${{ inputs.cities || (github.event_name != 'workflow_dispatch' && '20') || '1' }}
          PROMPTS: ${{ inputs.prompts || (github.event_name != 'workflow_dispatch' && '3') || '2' }}
          MAX_CALLS: ${{ inputs.max_calls || (github.event_name != 'workflow_dispatch' && '1000') || '6' }}
        run: katalog geo-measure --cities "$CITIES" --per-city-prompts "$PROMPTS" --max-calls "$MAX_CALLS" --save-raw queue/results/reports/geo-raw
      - name: Surowe odpowiedzi do kolejki
        if: always()
        run: bash scripts/queue_sync.sh push-results
