# Najnowsze oferty nieruchomości ze stron opublikowanych biur: tytuł i link (najwyżej 20 na biuro), raz dziennie.
# Crawler respektuje robots.txt i zachowuje odstęp między zapytaniami do jednego hosta. Raport każdej domeny jest w logu.
name: offers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tylko raport w logu, bez zapisu w bazie"
        type: boolean
        default: false
      limit:
        description: "Najwyżej tyle domen w jednym przebiegu"
        default: "300"
  schedule:
    - cron: "7 5 * * *"

concurrency:
  group: katalog-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/worker
      - name: Migracje
        run: katalog migrate
      - name: Oferty ze stron biur
        env:
          INPUT_LIMIT: ${{ inputs.limit || '300' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: katalog offers --limit "$INPUT_LIMIT" $INPUT_DRY_RUN
