# Ręczne uruchomienie etapów pipeline'u na GitHub Actions.
# NIEPRZETESTOWANE: powstało bez dostępu do GitHuba. Ograniczenia, o których trzeba wiedzieć:
# - system plików runnera jest tymczasowy, więc etapy zależne od snapshotów (probe, verify, crawl-deep, bundle)
#   muszą działać w jednym zadaniu, jak poniżej. Paczki dla Claude Code trafiają do prywatnego
#   repozytorium rankingbiur-kolejka (scripts/queue_sync.sh), bo sesje Claude Code nie mają dostępu do artefaktów Actions. Wyniki importuje
#   workflow import.yml,
# - biała lista VAT bywa blokowana przez ochronę przed botami dla adresów centrów danych (Incapsula),
# - przy uruchomieniu z harmonogramu nie ma parametrów: pliki kandydatów i Serper (gdy jest klucz), limit 450.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Źródło kandydatów: file = wyniki zebrane przez Claude Code (bez klucza), serper lub brave = API"
        type: choice
        options: [file, serper, brave]
        default: file
      city:
        description: "Miasto dla serper lub brave (puste = pomiń discover). Dla file miasto jest w pliku kandydatów"
        required: false
        default: ""
      limit:
        description: "Limit domen na etap"
        default: "450"
      chain:
        description: "Numer przebiegu w serii uruchamianej automatycznie (0 = uruchomiony ręcznie lub z harmonogramu)"
        default: "0"
  # Co godzinę (szybkie uzupełnianie katalogu): import wyników, publikacja, nowi kandydaci, probe, verify, crawl,
  # paczki. Przebieg trwa 45-70 minut, a grupa katalog-db pilnuje, żeby naraz szedł tylko jeden.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read # paczki idą do repozytorium kolejki z tokenem QUEUE_REPO_TOKEN
  actions: write # uruchomienie kolejnego przebiegu, gdy została praca

concurrency:
  group: katalog-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Kolejka paczek leży w prywatnym repozytorium rankingbiur-kolejka (scripts/queue_sync.sh).
      QUEUE_REPO_TOKEN: ${{ secrets.QUEUE_REPO_TOKEN }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
      QUEUE_DIR: ./queue
      SNAPSHOTS_DIR: ./snapshots
    steps:
      - uses: actions/checkout@v4
        with:
          # Bez zapamiętanego tokenu tego repozytorium: przykrywałby on token kolejki (QUEUE_REPO_TOKEN).
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/worker
      - name: Migracje
        run: katalog migrate
      - name: Pobranie kolejki z repozytorium kolejki
        run: bash scripts/queue_sync.sh pull
      - name: S7 import wyników Claude Code
        run: katalog import
      - name: Publikacja wpisów spełniających bramkę
        run: katalog publish-ready
      - name: Odtworzenie zadań bez plików paczek
        run: katalog requeue-lost
      # Zrzuty stron przechodzą między przebiegami przez cache Actions (runner jest tymczasowy).
      - name: Przywrócenie zrzutów stron
        uses: actions/cache/restore@v4
        with:
          path: snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - name: S1 discover z plików kandydatów (bez klucza API)
        if: ${{ (inputs.provider || 'file') == 'file' }}
        run: |
          shopt -s nullglob
          files=(queue/candidates/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Brak plików w queue/candidates w repozytorium kolejki."
          fi
          for f in "${files[@]}"; do
            katalog discover --provider file --file "$f"
          done
      # Szukanie biur przez Serper (wyniki Google) w kolejnych miastach z kolejki panelu: 15 miast na przebieg,
      # duże miasta dokładnie (po dzielnicach). Bez klucza ten krok się nie wykonuje.
      - name: S1 szukanie biur w kolejnych miastach (Serper)
        if: ${{ env.SERPER_API_KEY != '' && (inputs.city || '') == '' }}
        run: katalog discover-queue --provider serper --cities 15
      - name: S1 discover przez API wyszukiwarki
        if: ${{ (inputs.provider || 'file') != 'file' && inputs.city != '' }}
        env:
          INPUT_CITY: ${{ inputs.city }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: katalog discover --city "$INPUT_CITY" --provider "$INPUT_PROVIDER"
      - name: S3-S6
        env:
          INPUT_LIMIT: ${{ inputs.limit || '450' }}
        run: |
          # Cały przebieg ma 120 minut. Otwieranie 400 stron trwało ok. 47 min, a pobranie 200 serwisów ponad godzinę,
          # więc zadanie było przerywane przed przygotowaniem paczek. Mniejsze porcje i twarde limity czasu: paczki
          # (bundle) powstają zawsze, a reszta stron przechodzi do następnego przebiegu (co 3 godziny).
          timeout 30m katalog probe --limit "$INPUT_LIMIT" || echo "probe: limit czasu, reszta w następnym przebiegu"
          timeout 15m katalog verify --limit "$((INPUT_LIMIT * 2))" || echo "verify: limit czasu"
          timeout 35m katalog crawl-deep --limit "$((INPUT_LIMIT / 3))" || echo "crawl-deep: limit czasu, reszta w następnym przebiegu"
          katalog bundle --limit "$INPUT_LIMIT" > bundle-result.json
          cat bundle-result.json
          katalog status
      # Nowe firmy dostają telefon, e-mail, social media i logo od razu, a nie dopiero następnego ranka.
      - name: Kontakty i zdjęcia nowych firm
        run: katalog contacts --only-new --limit 150
      # Publikacja i zapis zrzutów także po błędzie: paczki zapisane w bazie muszą mieć swoje pliki na gałęzi.
      - name: Publikacja paczek w repozytorium kolejki
        if: ${{ always() }}
        run: bash scripts/queue_sync.sh push-pending
      - name: Kolejka miast z panelu dla porannej sesji
        if: ${{ always() }}
        run: |
          katalog cities --export queue/cities.json
          bash scripts/queue_sync.sh push-cities
      - name: Prompt opisów z panelu dla sesji Claude
        if: ${{ always() }}
        run: |
          katalog prompts --export queue/prompts/describe.md
          if [ -f queue/prompts/describe.md ]; then bash scripts/queue_sync.sh push-prompts; fi
      - name: Zapis zrzutów stron
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: snapshots
          key: snapshots-${{ github.run_id }}
      # Harmonogram GitHuba często pomija przebiegi, więc przebieg sam uruchamia następny, dopóki jest praca:
      # nieprzeszukane miasta, domeny do otwarcia albo nowe paczki w tym przebiegu. Najwyżej 24 przebiegi pod rząd.
      - name: Kolejny przebieg, gdy została praca
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          katalog backlog > backlog.json
          cat backlog.json
          more=$(python - <<'PY'
          import json, pathlib

          def last_json(path):
              # Ostatni obiekt JSON w pliku (na wypadek komunikatów przed nim).
              p = pathlib.Path(path)
              if not p.exists():
                  return {}
              text = p.read_text()
              start = text.rfind("\n{")
              try:
                  return json.loads(text[start + 1:] if start >= 0 else text)
              except ValueError:
                  return {}

          b = last_json("backlog.json")
          made = last_json("bundle-result.json").get("describe", 0)
          print(1 if (b.get("probe", 0) > 0 or b.get("cities", 0) > 0 or made > 0) else 0)
          PY
          )
          if [ "$more" = "1" ] && [ "$CHAIN" -lt 24 ]; then
            echo "Została praca, uruchamiam przebieg nr $((CHAIN + 1)) w serii."
            gh workflow run pipeline.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain="$((CHAIN + 1))"
          else
            echo "Bez kolejnego przebiegu (praca: $more, przebieg w serii: $CHAIN)."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: queue
          path: queue/
          if-no-files-found: ignore
