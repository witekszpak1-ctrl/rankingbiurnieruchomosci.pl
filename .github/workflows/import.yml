# Import wyników Claude Code do bazy (etap S7). Czyta paczki i wyniki z prywatnego repozytorium kolejki,
# waliduje wyniki w kodzie (cytaty w źródle, fakty, nakładanie się n-gramów, ceny) i zapisuje je w bazie.
# Co godzinę: wyniki wysłane przez sesję Claude Code trafiają do bazy, a wpisy spełniające bramkę są publikowane.
name: import

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *" # co godzinę: opisy z sesji Claude trafiają na stronę najpóźniej po około godzinie

concurrency:
  group: katalog-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Kolejka paczek leży w prywatnym repozytorium rankingbiur-kolejka (scripts/queue_sync.sh).
      QUEUE_REPO_TOKEN: ${{ secrets.QUEUE_REPO_TOKEN }}
      QUEUE_DIR: ./queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/worker
      - name: Migracje
        run: katalog migrate
      - name: Pobranie kolejki z repozytorium kolejki
        run: bash scripts/queue_sync.sh pull
      - name: S7 import
        run: katalog import
      - name: Publikacja wpisów spełniających bramkę
        run: katalog publish-ready
      - name: Usunięcie danych z formularzy po okresie przechowywania (polityka prywatności)
        run: katalog purge-personal
      - name: Stan
        run: katalog status
